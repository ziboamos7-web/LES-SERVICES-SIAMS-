<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIAMS V70 PREMIUM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p-500:#0066FF;--p-600:#0052CC;--p-50:#EEF5FF;--s-500:#FF7A1A;--dark:#0F172A;--text-main:#1E293B;--text-muted:#64748B;--bg:#F8FAFC;--surface:#FFFFFF;--border:#E2E8F0;--success:#10B981;--error:#EF4444;--radius-lg:24px;--radius-md:16px;--shadow:0 10px 25px -5px rgba(0,0,0,0.05);--font-display:'Plus Jakarta Sans',sans-serif;--font-body:'Inter',sans-serif}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text-main);overscroll-behavior-y:none}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px}
.card-v70{background:var(--surface);border-radius:var(--radius-lg);padding:20px;margin:10px 20px;border:1px solid var(--border);box-shadow:var(--shadow)}
.finance-hero{background:var(--dark);color:#fff;padding:30px 24px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.bottom-nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:rgba(255,255,255,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.3);border-radius:var(--radius-lg);display:flex;padding:8px;z-index:1000;box-shadow:var(--shadow)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;color:var(--text-muted);cursor:pointer;padding:10px 0;border-radius:var(--radius-md)}
.nav-item.active{background:var(--p-50);color:var(--p-500)}
.nav-item svg{width:22px;height:22px}
.btn-v70{width:100%;padding:16px;border-radius:var(--radius-md);border:none;font-weight:700;font-family:var(--font-display);cursor:pointer;transition:0.2s}
.btn-p{background:var(--p-500);color:#fff}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text-muted)}
.field input, .field select, .field textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:12px;font-family:inherit}
.hidden{display:none !important}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:480px;background:var(--surface);padding:20px;border-radius:24px 24px 0 0;z-index:1001;transition:0.3s;box-shadow:0 -10px 40px rgba(0,0,0,0.1)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;opacity:0;transition:0.3s}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 24px;border-radius:99px;font-size:13px;z-index:2000;display:none}
</style>
</head>
<body>
<div id="app">
    <main id="page-root"></main>
    <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item" data-nav="dashboard" onclick="Router.go('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>HOME</span></button>
        <button class="nav-item" data-nav="orders" onclick="Router.go('orders')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/></svg><span>VENTES</span></button>
        <button class="nav-item" data-nav="products" onclick="Router.go('products')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><span>STOCK</span></button>
        <button class="nav-item" onclick="Sheet.open()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg><span>PLUS</span></button>
    </nav>
    <nav class="bottom-nav hidden" id="client-nav">
        <button class="nav-item" onclick="Router.go('shop')">BOUTIQUE</button>
        <button class="nav-item" onclick="Router.go('cart')">PANIER</button>
    </nav>
    <div class="overlay" id="overlay" onclick="Sheet.close()"></div>
    <div id="sheet" class="sheet"></div>
    <div id="toast" class="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient('https://anlqgkrjiwkeaqikgdcd.supabase.co','sb_publishable_xc3fRNdG_R-CNkeVBseU2w_sIDz-3j4');
const Utils={
    fmtFCFA:n=>Number(n||0).toLocaleString('fr-FR')+' FCFA',
    uid:()=>'id-'+Math.random().toString(36).substr(2,9),
    copy:t=>{const e=document.createElement('textarea');e.value=t;document.body.appendChild(e);e.select();document.execCommand('copy');document.body.removeChild(e);Toast.show("Copié !")}
};
let _cache={store:{},products:[],orders:[],cart:[]};
const Store={
    get store(){return _cache.store},set store(v){_cache.store=v;Cloud.pushStore(v)},
    get products(){return _cache.products},set products(v){_cache.products=v;Cloud.pushProducts(v)},
    get orders(){return _cache.orders},
    get cart(){return _cache.cart},set cart(v){_cache.cart=v},
    revenueDelivered:()=>_cache.orders.filter(o=>o.status==='delivered').reduce((s,o)=>s+(o.amount||0),0),
    orderStatusCounts:()=>({new:_cache.orders.filter(o=>o.status==='pending').length,done:_cache.orders.filter(o=>o.status==='delivered').length})
};
const Cloud={
    storeId:null,
    async loadAll(){
        const {data:s}=await sb.from('stores').select('*').eq('id',this.storeId).single();
        const {data:p}=await sb.from('products').select('*').eq('store_id',this.storeId);
        const {data:o}=await sb.from('orders').select('*').eq('store_id',this.storeId);
        if(s)_cache.store=s;if(p)_cache.products=p;if(o)_cache.orders=o;Router.render();
    },
    async pushStore(n){await sb.from('stores').update({name:n.name}).eq('id',this.storeId)},
    async pushProducts(p){for(const i of p){await sb.from('products').upsert({...i,store_id:this.storeId})}}
};
const Auth={logout:async()=>{await sb.auth.signOut();location.reload()}};
const Router={
    current:'dashboard', params:{},
    go(p,pr={}){this.current=p;this.params=pr;this.render()},
    render(){
        const r=document.getElementById('page-root');
        if(Views[this.current])r.innerHTML=Views[this.current](this.params);
        const isC=['shop','cart','checkout','shop-product'].includes(this.current);
        document.getElementById('bottom-nav').classList.toggle('hidden',isC);
        document.getElementById('client-nav').classList.toggle('hidden',!isC);
    }
};
const Sheet={
    open:()=>{const s=document.getElementById('sheet');s.innerHTML=`<h3>Menu</h3><button class="btn-v70" onclick="Router.go('settings')">Paramètres</button><button class="btn-v70" onclick="Auth.logout()">Déconnexion</button>`;s.style.transform="translate(-50%,0)";document.getElementById('overlay').style.display="block"},
    close:()=>{document.getElementById('sheet').style.transform="translate(-50%,100%)";document.getElementById('overlay').style.display="none"}
};
const Toast={show:m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2000)}};

const Views={
    dashboard:()=>`<div class="finance-hero"><h1>${Store.store.name||'SIAMS'}</h1><div class="balance-value">${Utils.fmtFCFA(Store.revenueDelivered())}</div></div><div class="card-v70"><h3>Ventes: ${Store.orderStatusCounts().done} livrées</h3></div>`,
    products:()=>`<div class="topbar"><h1>Stock</h1><button class="btn-v70 btn-p" onclick="Router.go('product-add')">＋</button></div>${Store.products.map(p=>`<div class="card-v70"><b>${p.name}</b> - ${Utils.fmtFCFA(p.price)}</div>`).join('')}`,
    'product-add':()=>`<div class="topbar"><h1>Ajouter</h1></div><div class="card-v70"><div class="field"><label>Nom</label><input id="p-name"></div><div class="field"><label>Prix</label><input id="p-price" type="number"></div><button class="btn-v70 btn-p" onclick="saveNewP()">Enregistrer</button></div>`,
    shop:()=>`<div class="topbar"><h1>Boutique</h1></div><div class="card-v70">${Store.products.map(p=>`<div>${p.name} <button onclick="Router.go('shop-product',{id:'${p.id}'})">Voir</button></div>`).join('')}</div>`,
    'shop-product':(p)=>`<div class="topbar"><h1>Détail</h1></div><div class="card-v70"><h2>Produit ID: ${p.id}</h2><button class="btn-v70 btn-p" onclick="addToCart('${p.id}')">Ajouter au panier</button></div>`,
    cart:()=>`<div class="topbar"><h1>Panier</h1></div><div class="card-v70">Articles: ${Store.cart.length}<button class="btn-v70 btn-p" onclick="Router.go('checkout')">Commander</button></div>`,
    checkout:()=>`<div class="topbar"><h1>Paiement</h1></div><div class="card-v70"><button class="btn-v70 btn-p" onclick="alert('Commande validée')">Confirmer</button></div>`,
    settings:()=>`<div class="topbar"><h1>Paramètres</h1></div><div class="card-v70"><button class="btn-v70" onclick="Auth.logout()">Déconnexion</button></div>`
};

function saveNewP(){const n=document.getElementById('p-name').value;const p=document.getElementById('p-price').value;Store.products=[...Store.products,{id:Utils.uid(),name:n,price:p}];Router.go('products')}
function addToCart(id){Store.cart=[...Store.cart,id];Toast.show("Ajouté !")}

async function init(){
    const {data:{session}}=await sb.auth.getSession();
    if(session){Cloud.storeId=session.user.id;await Cloud.loadAll();Router.go('dashboard')}
    else Router.go('shop');
}
window.onload=init;
</script>
</body>
</html>
